<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple personal information site." />
    <title>Welcome | Basic Info</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #f3f6f4;
        color: #23332d;
        font:
          16px/1.6 system-ui,
          sans-serif;
      }
      main {
        width: min(100%, 620px);
        padding: clamp(2rem, 7vw, 4rem);
        background: #fff;
        border: 1px solid #e3ebe6;
        border-radius: 20px;
        box-shadow: 0 16px 45px #23332d12;
      }
      .eyebrow {
        margin: 0 0 0.75rem;
        color: #318263;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 8vw, 3.5rem);
        line-height: 1.1;
      }
      .intro {
        margin: 1.25rem 0 2rem;
        color: #617169;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }
      nav a {
        padding: 0.65rem 1rem;
        border-radius: 999px;
        background: #eaf4ee;
        color: #24694f;
        font-weight: 600;
        text-decoration: none;
      }
      nav a:hover,
      nav a:focus-visible {
        background: #d7eadf;
      }
      footer {
        margin-top: 3rem;
        color: #849189;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">A little about this site</p>
      <h1>Welcome!</h1>
      <p class="intro">
        This is a simple place to share a bit of information. Choose a page
        below to learn more.
      </p>
      <nav aria-label="Main navigation">
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/contact-me">Contact</a>
      </nav>
      <footer>Made with care.</footer>
    </main>
  </body>
</html>
