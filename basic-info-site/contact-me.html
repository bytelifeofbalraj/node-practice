<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Me</title>
    <style>
      :root {
        --bg-1: #f3f7ff;
        --bg-2: #eef2ff;
        --card: rgba(255, 255, 255, 0.8);
        --text: #1f2937;
        --muted: #5b6474;
        --primary: #4f46e5;
        --primary-dark: #3730a3;
        --border: rgba(79, 70, 229, 0.12);
        --shadow: 0 20px 45px rgba(79, 70, 229, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
        color: var(--text);
      }

      .container {
        width: min(900px, 90vw);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(8px);
        overflow: hidden;
      }

      .content {
        display: grid;
        grid-template-columns: 1.1fr 1.4fr;
      }

      .info {
        padding: 48px 36px;
        background: linear-gradient(180deg, #eef2ff 0%, #f8faff 100%);
        border-right: 1px solid var(--border);
      }

      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-size: 0.72rem;
        font-weight: 700;
        color: var(--primary);
        margin-bottom: 12px;
      }

      .back-link {
        display: inline-block;
        margin-bottom: 24px;
        color: var(--primary);
        font-weight: 700;
        text-decoration: none;
      }

      .back-link:hover {
        text-decoration: underline;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(2rem, 3vw, 3rem);
        line-height: 1.1;
      }

      .info p {
        margin: 0 0 28px;
        line-height: 1.6;
        color: var(--muted);
      }

      .details {
        display: grid;
        gap: 18px;
      }

      .detail {
        display: flex;
        align-items: center;
        gap: 14px;
        color: var(--text);
        font-weight: 600;
      }

      .icon {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: rgba(79, 70, 229, 0.1);
        color: var(--primary);
        font-size: 1.1rem;
      }

      .form-wrap {
        padding: 48px 36px;
      }

      form {
        display: grid;
        gap: 18px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      label {
        font-size: 0.9rem;
        font-weight: 700;
        color: var(--text);
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid rgba(148, 163, 184, 0.5);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.7);
        padding: 14px 16px;
        font: inherit;
        color: var(--text);
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease;
      }

      textarea {
        min-height: 140px;
        resize: vertical;
      }

      input:focus,
      textarea:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.08);
      }

      button {
        margin-top: 8px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(
          135deg,
          var(--primary),
          var(--primary-dark)
        );
        color: white;
        font: inherit;
        font-weight: 700;
        padding: 15px 20px;
        cursor: pointer;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
        box-shadow: 0 14px 24px rgba(79, 70, 229, 0.25);
      }

      button:hover {
        transform: translateY(-1px);
      }

      @media (max-width: 760px) {
        .content {
          grid-template-columns: 1fr;
        }

        .info {
          border-right: none;
          border-bottom: 1px solid var(--border);
        }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <section class="content">
        <div class="info">
          <a class="back-link" href="/">← Back to home</a>
          <div class="eyebrow">Let’s talk</div>
          <h1>Contact me</h1>
          <p>
            I’d love to hear about your project, idea, or question. Send a
            message, and I’ll get back to you as soon as possible.
          </p>

          <div class="details">
            <div class="detail">
              <div class="icon">✉</div>
              <span>hello@example.com</span>
            </div>
            <div class="detail">
              <div class="icon">📍</div>
              <span>Somewhere in the world</span>
            </div>
            <div class="detail">
              <div class="icon">📞</div>
              <span>+91 12345-67890</span>
            </div>
          </div>
        </div>

        <div class="form-wrap">
          <form action="#" method="post">
            <div class="field">
              <label for="name">Name</label>
              <input
                id="name"
                name="name"
                type="text"
                placeholder="Your name"
              />
            </div>

            <div class="field">
              <label for="email">Email</label>
              <input
                id="email"
                name="email"
                type="email"
                placeholder="you@example.com"
              />
            </div>

            <div class="field">
              <label for="message">Message</label>
              <textarea
                id="message"
                name="message"
                placeholder="Tell me a bit about your project..."
              ></textarea>
            </div>

            <button type="submit">Send message</button>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
